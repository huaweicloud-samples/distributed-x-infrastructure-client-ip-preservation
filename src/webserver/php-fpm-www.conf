; PHP-FPM 进程池：固定监听 127.0.0.1:9000，与 nginx / HAProxy 的 FastCGI 上游一致。
; 只接受本机回环连接，不对外暴露。
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
